[theme]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1C33"
secondaryBackgroundColor = "#132A47"
textColor = "#E8EEF5"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"